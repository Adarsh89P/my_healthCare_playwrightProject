name: Playwright Tests

on:
  push:
    # `master` is currently the default branch; `main` is listed so the
    # workflow keeps running if the branch is ever renamed.
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master, 'feature/**']
  # Nightly full run at 02:00 UTC catches environment drift and slow-burn
  # flakiness that a per-push run would not surface.
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run
        type: choice
        default: all
        options: [all, smoke, regression]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_ENV: uat
  # Which application under src/apps + tests to run. Override per workflow if
  # the repository grows a second app.
  APP: healthcare
  BROWSERS: chromium,firefox,webkit
  # BASE_URL and credentials come from repository variables/secrets so this
  # workflow is reusable across projects without edits. The fallbacks are the
  # CURA demo app's own published demo values, not real secrets.
  BASE_URL: ${{ vars.BASE_URL || 'https://katalon-demo-cura.herokuapp.com/' }}
  APP_USER_USERNAME: ${{ secrets.APP_USER_USERNAME || 'John Doe' }}
  APP_USER_PASSWORD: ${{ secrets.APP_USER_PASSWORD || 'ThisIsNotAPassword' }}

jobs:
  # ---------------------------------------------------------------- static checks
  quality:
    name: Lint, format & types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      # AI-layer parsing/fallback tests - no browser, no network, no API key.
      - name: Unit tests
        run: npm run test:unit

  # ------------------------------------------------------------------- test shards
  test:
    name: Tests (shard ${{ matrix.shard }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Browser binaries are large and rarely change - cache them against the
      # Playwright version so runs don't redownload every time.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install system dependencies only
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Run tests
        run: |
          GREP=""
          case "${{ inputs.suite || 'all' }}" in
            smoke)      GREP="--grep @smoke" ;;
            regression) GREP="--grep @regression" ;;
          esac
          npx playwright test $GREP --shard=${{ matrix.shard }}/4

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 7

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.shard }}
          path: allure-results/
          retention-days: 7

  # ------------------------------------------------------------------ merge reports
  report:
    name: Merge & publish reports
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge shards into one HTML report
        run: npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          path: allure-results
          pattern: allure-results-*
          merge-multiple: true

      # Restores previous runs so the Allure report shows trends instead of
      # resetting on every build.
      - name: Restore Allure history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1.12
        with:
          allure_results: allure-results
          allure_history: allure-history
          gh_pages: gh-pages
          keep_reports: 20

      - name: Publish Allure report to GitHub Pages
        # Publish from whatever the repository's default branch is, so this
        # keeps working after the branch is renamed to `main`.
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
